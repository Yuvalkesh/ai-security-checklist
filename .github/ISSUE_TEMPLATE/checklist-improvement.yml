name: Checklist improvement
description: Suggest a generic improvement to the public checklist.
title: "[Checklist] "
body:
  - type: markdown
    attributes:
      value: "This is a PUBLIC issue. Do not include credentials, completed assessments, internal system details or unremediated vulnerabilities."
  - type: input
    id: controls
    attributes:
      label: Affected control IDs
      placeholder: "K05, I02"
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: What is missing or unclear?
      description: Describe the generic documentation problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested wording and safe verification method
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public content check
      options:
        - label: This submission contains no secrets, private assessment evidence or internal vulnerability details.
          required: true
